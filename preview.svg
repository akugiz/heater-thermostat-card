<svg xmlns="http://www.w3.org/2000/svg" width="524" height="560" viewBox="0 0 524 560" role="img" aria-labelledby="title desc">
  <title id="title">Heater Thermostat Card compact preview</title>
  <desc id="desc">Compact Home Assistant heater thermostat card with power button, current temperature, draggable blue and red threshold arc, adjustment buttons and threshold information.</desc>
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="524" height="560" fill="#11121b"/>
  <rect x="9" y="11" width="500" height="547" rx="12" fill="#1d1e2d" stroke="#343548"/>

  <circle cx="43" cy="44" r="21" fill="#151622" filter="url(#shadow)"/>
  <path d="M43 32v12M35.5 36.5a11 11 0 1 0 15 0" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>

  <text x="262" y="42" text-anchor="middle" fill="#d9d9ef" font-family="Arial, sans-serif" font-size="17" font-weight="700">Heater Thermostat</text>
  <text x="262" y="84" text-anchor="middle" fill="#d5d8f4" font-family="Arial, sans-serif" font-size="45" font-weight="500">25.4<tspan dx="3" font-size="19">°C</tspan></text>
  <text x="262" y="111" text-anchor="middle" fill="#b9bbd1" font-family="Arial, sans-serif" font-size="14" font-weight="600">Heater: OFF</text>

  <path d="M137 267 A123 123 0 0 1 381 267" fill="none" stroke="#2a2b3d" stroke-width="18" stroke-linecap="round"/>
  <path d="M137 267 A123 123 0 0 1 266 145" fill="none" stroke="#2196f3" stroke-width="18" stroke-linecap="round"/>
  <path d="M324 165 A123 123 0 0 1 381 267" fill="none" stroke="#ff4545" stroke-width="18" stroke-linecap="round"/>
  <circle cx="266" cy="145" r="15" fill="#2196f3" stroke="#1d1e2d" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="324" cy="165" r="15" fill="#ff4545" stroke="#1d1e2d" stroke-width="5" filter="url(#shadow)"/>

  <text x="44" y="295" fill="#2196f3" font-family="Arial, sans-serif" font-size="14" font-weight="700">ON at</text>
  <text x="44" y="327" fill="#d9d9ef" font-family="Arial, sans-serif" font-size="28">18°C</text>
  <text x="476" y="295" text-anchor="end" fill="#ff4545" font-family="Arial, sans-serif" font-size="14" font-weight="700">OFF at</text>
  <text x="476" y="327" text-anchor="end" fill="#d9d9ef" font-family="Arial, sans-serif" font-size="28">22°C</text>

  <g fill="none" stroke="#2196f3" stroke-width="1.3">
    <circle cx="61" cy="358" r="18"/>
    <circle cx="108" cy="358" r="18"/>
    <path d="M55 358h12M102 358h12M108 352v12" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="#ff4545" stroke-width="1.3">
    <circle cx="410" cy="358" r="18"/>
    <circle cx="456" cy="358" r="18"/>
    <path d="M404 358h12M450 358h12M456 352v12" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <rect x="23" y="386" width="231" height="107" rx="12" fill="#171824" stroke="#343548"/>
  <path d="M24 398v83" stroke="#16a9f3" stroke-width="3" stroke-linecap="round"/>
  <text x="35" y="414" fill="#2fa6f5" font-family="Arial, sans-serif" font-size="14" font-weight="700">Heater ON</text>
  <text x="35" y="451" fill="#d9d9ef" font-family="Arial, sans-serif" font-size="27">18°C</text>
  <text x="35" y="476" fill="#b9bbd1" font-family="Arial, sans-serif" font-size="11">Drag blue handle</text>

  <rect x="265" y="386" width="231" height="107" rx="12" fill="#171824" stroke="#343548"/>
  <path d="M266 398v83" stroke="#ff4545" stroke-width="3" stroke-linecap="round"/>
  <text x="277" y="414" fill="#ff4545" font-family="Arial, sans-serif" font-size="14" font-weight="700">Heater OFF</text>
  <text x="277" y="451" fill="#d9d9ef" font-family="Arial, sans-serif" font-size="27">22°C</text>
  <text x="277" y="476" fill="#b9bbd1" font-family="Arial, sans-serif" font-size="11">Drag red handle</text>

  <rect x="23" y="505" width="473" height="39" rx="10" fill="#1b1c2a" stroke="#343548"/>
  <text x="259.5" y="529" text-anchor="middle" fill="#b9bbd1" font-family="Arial, sans-serif" font-size="12">Minimum gap: 1°C · Minimum cycle: Off</text>
</svg>
